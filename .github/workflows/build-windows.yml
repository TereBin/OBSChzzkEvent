name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # The CMake preset targets Visual Studio 17 2022 explicitly.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake --preset windows-x64
      - name: Build
        run: cmake --build --preset windows-x64 --config Release
      - name: Install
        run: cmake --install build_x64 --config Release --prefix release/Release
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: obs-chzzk-alerts-windows-x64
          path: release/Release/obs-chzzk-alerts

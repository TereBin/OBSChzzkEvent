<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>치지직 알림</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Malgun Gothic", "Noto Sans KR", sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    #alert {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      opacity: 0;
      transition: opacity 180ms ease;
    }

    #alert.visible { opacity: 1; }

    #message {
      max-width: 90vw;
      padding: 18px 28px;
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 14px;
      color: #fff;
      background: rgba(20, 20, 28, 0.88);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      font-size: clamp(20px, 4vw, 42px);
      font-weight: 700;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.65);
    }
  </style>
</head>
<body>
  <div id="alert" aria-live="polite"><div id="message"></div></div>
  <script>
    (() => {
      const alertBox = document.getElementById("alert");
      const message = document.getElementById("message");
      let hideTimer;

      function textFor(event) {
        const nickname = event?.nickname || "시청자";
        return `${nickname}님이 팔로우하였습니다.`;
      }

      function show(event) {
        message.textContent = event?.message || textFor(event);
        alertBox.classList.add("visible");
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => alertBox.classList.remove("visible"), Number(event?.durationMs) || 5000);
      }

      window.addEventListener("message", (event) => {
        if (event.data && typeof event.data === "object") show(event.data);
      });

      if ("BroadcastChannel" in window) {
        const channel = new BroadcastChannel("obs-chzzk-alert");
        channel.addEventListener("message", (event) => show(event.data));
      }

      if ("EventSource" in window) {
        const events = new EventSource("http://127.0.0.1:21345/events");
        events.addEventListener("message", (event) => {
          try { show(JSON.parse(event.data)); } catch (_) { /* Ignore malformed events. */ }
        });
      }

      const params = new URLSearchParams(location.search);
      if (params.has("demo")) {
        show({ type: params.get("demo"), nickname: params.get("nickname") || "테스트 사용자" });
      }
    })();
  </script>
</body>
</html>
